function firstWorld(p){return String(p['Associated Worlds / Colonies']||'').split(';')[0].trim()}function displayName(p){const w=firstWorld(p);return w&&p['Location Type']==='Star System'?p.Name+' ('+w+')':p.Name}function groupName(p){if(p.Faction==='Covenant')return 'Covenant Worlds';if(p.Faction==='Forerunner')return 'Forerunner Installations';if(p.Faction==='UNSC'&&p.Region==='Inner Colonies')return 'UNSC Inner Colonies';return 'UNSC Outer Colonies'}function markerColor(p){return GROUPS[groupName(p)]?.color||'#94A3B8'}
function visible(p){return layers[p.Faction]!==false&&(p.Confidence!=='Low'||layers.Low)}function resize(){dpr=Math.max(1,devicePixelRatio||1);canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function line(a,b,c,d,color,w=1){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}
function mark(p,px,py,r){const shape=(REFS[p.Classification]||{shape:'Circle'}).shape;ctx.beginPath();if(shape==='Diamond'){ctx.moveTo(px,py-r);ctx.lineTo(px+r,py);ctx.lineTo(px,py+r);ctx.lineTo(px-r,py);ctx.closePath()}else if(shape==='Square')ctx.rect(px-r,py-r,r*2,r*2);else ctx.arc(px,py,r,0,Math.PI*2);ctx.fillStyle=markerColor(p);ctx.fill();if(selected===p){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#050a11';ctx.fillRect(0,0,w,h);const left=wx(0),right=wx(w),bottom=wy(h),top=wy(0),step=view.scale<5?20:view.scale<10?10:5;ctx.font='10px Consolas';for(let n=Math.floor(left/step)*step;n<=right;n+=step){const px=canvas.clientWidth/2+(n-view.cx)*view.scale;line(px,0,px,h,n===0?'#81a8c4':'#1e3447',n===0?1.5:1);ctx.fillStyle='#70879a';ctx.fillText(n,px+3,canvas.clientHeight/2+12+view.cy*view.scale)}for(let n=Math.floor(bottom/step)*step;n<=top;n+=step){const py=canvas.clientHeight/2-(n-view.cy)*view.scale;line(0,py,w,py,n===0?'#81a8c4':'#1e3447',n===0?1.5:1);ctx.fillStyle='#70879a';ctx.fillText(n,canvas.clientWidth/2+7-view.cx*view.scale,py-4)}for(const p of DATA){if(!visible(p))continue;const px=x(p),py=y(p);if(px<-100||px>w+100||py<-60||py>h+60)continue;mark(p,px,py,selected===p?7:5);if(layers.Labels){ctx.font='11px Segoe UI';ctx.fillStyle='#dbe8f2';ctx.fillText(displayName(p),px+8,py-7)}}document.getElementById('readout').textContent=view.scale.toFixed(1)+' px/LY · drag to pan · wheel to zoom'}
function fit(){const a=DATA.filter(visible),xs=a.map(p=>Number(p['X (LY)'])),ys=a.map(p=>Number(p['Y (LY)']));const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);view.cx=(minx+maxx)/2;view.cy=(miny+maxy)/2;view.scale=Math.min((canvas.clientWidth-130)/(maxx-minx),(canvas.clientHeight-100)/(maxy-miny));draw()}function show(p){selected=p;document.getElementById('detail').innerHTML='<div class="eyebrow">LOCATION</div><h2>'+displayName(p)+'</h2><span class="tag">'+groupName(p)+'</span><div class="grid"><div class="card"><span>X</span><b>'+Number(p['X (LY)']).toFixed(1)+' LY</b></div><div class="card"><span>Y</span><b>'+Number(p['Y (LY)']).toFixed(1)+' LY</b></div><div class="card"><span>FACTION</span><b>'+p.Faction+'</b></div><div class="card"><span>CONFIDENCE</span><b>'+p.Confidence+'</b></div></div><div class="notes"><b>'+p.Region+'</b><br>'+(p['Associated Worlds / Colonies']||'No associated worlds recorded')+(p.Notes?'<br><br>'+p.Notes:'')+'</div>';draw()}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy};canvas.setPointerCapture(e.pointerId);canvas.classList.add('drag')});canvas.addEventListener('pointermove',e=>{if(!drag)return;view.cx=drag.cx-(e.clientX-drag.x)/view.scale;view.cy=drag.cy+(e.clientY-drag.y)/view.scale;draw()});canvas.addEventListener('pointerup',e=>{if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5){let best=null,dist=15;for(const p of DATA.filter(visible)){const d=Math.hypot(x(p)-e.offsetX,y(p)-e.offsetY);if(d<dist){best=p;dist=d}}if(best)show(best)}drag=null;canvas.classList.remove('drag')});canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,bx=wx(mx),by=wy(my);view.scale=Math.max(1,Math.min(40,view.scale*(e.deltaY<0?1.15:.87)));view.cx=bx-(mx-canvas.clientWidth/2)/view.scale;view.cy=by+(my-canvas.clientHeight/2)/view.scale;draw()},{passive:false});
for(const k of Object.keys(layers)){document.getElementById(k).onchange=e=>{layers[k]=e.target.checked;draw()}}document.getElementById('zin').onclick=()=>{view.scale*=1.25;draw()};document.getElementById('zout').onclick=()=>{view.scale/=1.25;draw()};document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=()=>{view={cx:0,cy:0,scale:7};draw()};document.getElementById('locations').innerHTML=DATA.map(p=>'<option value="'+displayName(p).replaceAll('"','&quot;')+'">').join('');document.getElementById('search').onkeydown=e=>{if(e.key!=='Enter')return;const q=e.target.value.toLowerCase(),p=DATA.find(x=>displayName(x).toLowerCase()===q)||DATA.find(x=>displayName(x).toLowerCase().includes(q));if(!p)return;view.cx=Number(p['X (LY)']);view.cy=Number(p['Y (LY)']);view.scale=Math.max(view.scale,12);show(p)};addEventListener('resize',resize);resize();requestAnimationFrame(fit);
